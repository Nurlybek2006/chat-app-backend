services:
  postgres:
    image: postgres:16
    container_name: chat_postgres
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d chatdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: chat_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat_backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env.docker

    environment:
      PORT: 3000
      NODE_ENV: development

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:
